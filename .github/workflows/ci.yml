name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify release baseline
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:4028
      NEXT_PUBLIC_API_URL: http://localhost:4028/api
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sparkle247
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Non-blocking while two known build-toolchain advisories remain
      # (postcss bundled inside Next 15; fixed by the Next 16 upgrade).
      # Flip to blocking once that upgrade lands.
      - name: Dependency audit (production, non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sparkle247_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-only-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:4028
      NEXT_PUBLIC_API_URL: http://localhost:4028/api
      # The runner enforces a local sparkle247_test database and derives
      # DATABASE_URL / DIRECT_URL from this value.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/sparkle247_test
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration
